server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' http://127.0.0.1:8090 http://localhost:8090 ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS — resolve at request time so missing upstreams do not fail nginx boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Co-deployed: same-origin bridge to OPA-Hub, kept for parity with the four
    # peer dashboards. OAM issues its own tokens (users.go owns /api/auth/*), so
    # unlike the peers this console does not need the bridge to sign in — it is
    # here so a hub-issued session works in either direction during the cutover.
    location /hub-auth/ {
        set $opa_hub_upstream http://hub:8080;
        rewrite ^/hub-auth/(.*)$ /$1 break;
        proxy_pass $opa_hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SCM connectors are still written through ora-api until the connector plane
    # fully lands in oam-api. Same-origin so the console stays one origin.
    location /api/connectors {
        set $ora_api_upstream http://ora-api:8091;
        proxy_pass $ora_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Account manager API (directory, users, credentials, bindings, audit).
    location /api/ {
        set $oam_api_upstream http://oam-api:8090;
        proxy_pass $oam_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
